[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# V2: server-side AI function (keeps AI_API_KEY off the browser). Served at /.netlify/functions/ai-chat
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Single-page app: send every route to index.html (functions under /.netlify/ are not affected)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
